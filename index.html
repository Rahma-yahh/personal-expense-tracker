<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <!-- CDN Bootstrap dan Bootstrap Icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--heading -->
    <nav class="navbar bg-success text-white px-3 py-2 shadow-sm">
        <div class="container-fluid d-flex align-items-center gap-2 text-start">
            <i class="bi bi-wallet fs-4"></i>
            <span class="navbar-brand mb-0 me-auto  h1">Expense Tracker</span>
        </div>
    </nav>
    <div class="container my-4">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card p-4 border-0 shadow-sm">
                    <h4 class="text-success fw-bold mb-0">Tambahan Pengeluaran</h4>
                    <form class="formPengeluaran">
                        <div id="pesanPeringatan" class="alert alert-danger d-none py-2 px-3 small mt-3" role="alert">
                            <i class="bi bi-exclamation-triangle me-1"></i>Harap isi nama dan nominal pengeluaran!
                        </div>
                        <div class="mb-3 mt-2">
                            <label for="InputTP">Nama Pengeluaran</label>
                            <input type="text" class="form-control" id="InputTP" placeholder="Contoh: Makan Siang">
                        </div>
                        <div class="mb-3">
                            <label for="NominalHarga">Nominal/Harga</label>
                            <input type="number" inputmode="numeric" class="form-control" id="NominalHarga"
                                placeholder="contoh: 25000">
                        </div>
                        <button type="button" id="btnSimpan" class="fw-bold btn btn-primary w-100"><i
                                class="bi bi-plus-circle"></i> Simpan Data</button>
                    </form>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card p-4 border-0 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="text-success fw-bold mb-3">Daftar pengeluaran</h4>
                        <span id="badgeDaftarPengeluaran" class="badge bg-danger fs-6 rounded-pill px-3 text-center ">Rp
                            0</span>
                    </div>
                    <div id="listPengeluaran"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
